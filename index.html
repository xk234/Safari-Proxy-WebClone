<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Safari (Final - Fixed Backgrounds)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="">

  <div id="browser-ui">
    <div id="nav-toolbar">
      <button class="nav-btn" title="Toggle Sidebar">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
      </button>
      
      <button id="back-btn" class="nav-btn" disabled>
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <button id="forward-btn" class="nav-btn" disabled>
        <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
      </button>

      <button id="home-btn" class="nav-btn" title="Home">
         <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      </button>

      <div id="urlbar-container">
        <div id="urlbar-wrapper">
          <button class="urlbar-icon" style="margin-right:4px">
             <svg viewBox="0 0 24 24"><path d="M5.5 2C3.5 2 2 3.5 2 5.5v13C2 20.5 3.5 22 5.5 22H19v-2H5.5c-1 0-1.5-.5-1.5-1.5S4.5 17 5.5 17H19V2H5.5z"/><path d="M16 5h-3v10h3V5z"/></svg>
          </button>
          
          <div id="url-spinner"></div>
          <svg id="url-lock" class="urlbar-icon" style="cursor:default; width:14px;" viewBox="0 0 24 24"><path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5zm-3 5a3 3 0 0 1 6 0v3H9V7z"/></svg>
          
          <input id="urlbar-input" type="text" placeholder="Search or enter website name" autocomplete="off" />
          
          <button class="urlbar-icon" id="reload-btn">
             <svg viewBox="0 0 24 24"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          </button>
        </div>
      </div>

      <button class="nav-btn" id="toolbar-plus-btn" title="New Tab">
         <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>

      <button class="nav-btn" title="Share">
        <svg viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
      </button>
      
      <button class="nav-btn" id="bookmarks-btn" title="Show Bookmarks">
         <svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
      </button>

      <button id="menu-btn" class="nav-btn">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><path d="M14 14h7v7h-7z"/><path d="M3 14h7v7H3z"/></svg>
      </button>
    </div>

    <div id="tabs-strip">
      <div id="tabs-container"></div>
      <button id="tab-strip-plus" title="New Tab">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>

    <div id="bookmarks-bar"></div>

    <div id="bookmarks-popup" class="popup-menu">
      <div style="padding:4px 12px;font-size:11px;opacity:0.5;font-weight:600;color:var(--tab-text)">FAVORITES</div>
      <div id="bookmarks-list"></div>
    </div>

    <div id="menu-popup" class="popup-menu">
      <div class="menu-item" id="menu-new-tab">New Tab <span style="margin-left:auto;opacity:0.5">⌘T</span></div>
      <div class="menu-item" style="opacity:0.5">New Window <span style="margin-left:auto;opacity:0.5">⌘N</span></div>
      <div class="menu-sep"></div>
      <div class="menu-item" id="menu-theme-toggle">Switch to Light Mode</div>
      <div class="menu-sep"></div>
      <div class="menu-item">Show History <span style="margin-left:auto;opacity:0.5">⌘Y</span></div>
    </div>
  </div>

  <div id="web-content"></div>
  <div id="status-bar">Ready</div>

  <script src="script.js"></script>
</body>
</html>
